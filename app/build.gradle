plugins {
    id 'com.android.application'
}

// Release signing: put storeFile/storePassword/keyAlias/keyPassword in
// <project>/keystore.properties (git-ignored). Without it, release is unsigned.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystore.load(it) }
}

android {
    namespace = 'com.tauslop.sleeptimer'
    compileSdk = 37

    defaultConfig {
        applicationId = 'com.tauslop.sleeptimer'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            create('release') {
                storeFile = file(keystore['storeFile'])
                storePassword = keystore['storePassword']
                keyAlias = keystore['keyAlias']
                keyPassword = keystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            vcsInfo.include = false
            if (keystoreFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    // Keep the APK minimal: no dependency metadata block.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}
